<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="とりあえず">
<meta name="theme-color" content="#5b5bf0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>とりあえず</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0f1020;
    --card: #1b1d33;
    --accent: #6c6cff;
    --accent2: #ff6cab;
    --text: #f2f3ff;
    --muted: #9a9cc0;
    --done: #2a2d4a;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    overflow-x: hidden;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 120px; }

  /* ステータス表示 */
  .status {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 22px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(108,108,255,0.3);
  }
  .status .lv { font-size: 13px; opacity: 0.9; letter-spacing: 1px; }
  .status .lvnum { font-size: 42px; font-weight: 800; line-height: 1.1; }
  .bar { height: 10px; background: rgba(255,255,255,0.25); border-radius: 10px; margin-top: 10px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: #fff; border-radius: 10px; width: 0; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .status .sub { font-size: 12px; margin-top: 8px; opacity: 0.9; display: flex; justify-content: space-between; }

  /* 入力 */
  .add { display: flex; gap: 8px; margin-bottom: 6px; }
  .add input.text {
    flex: 1; background: var(--card); border: none; border-radius: 14px;
    padding: 15px 16px; color: var(--text); font-size: 16px; min-width: 0;
  }
  .add input.num {
    width: 72px; flex-shrink: 0; background: var(--card); border: none; border-radius: 14px;
    padding: 15px 10px; color: var(--text); font-size: 16px; text-align: center;
  }
  .add input::placeholder { color: var(--muted); }
  .add button {
    background: var(--accent); border: none; border-radius: 14px;
    color: #fff; font-size: 24px; font-weight: 700; width: 54px; flex-shrink: 0;
    cursor: pointer; transition: transform .1s;
  }
  .add button:active { transform: scale(0.92); }
  .hint { font-size: 11px; color: var(--muted); margin: 0 4px 16px; }

  .section-label { font-size: 12px; color: var(--muted); margin: 18px 4px 8px; letter-spacing: 1px; }

  /* タスク */
  ul { list-style: none; }
  li {
    background: var(--card); border-radius: 14px; padding: 14px 16px;
    margin-bottom: 10px; display: flex; align-items: center; gap: 14px;
    animation: pop .35s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
  .check {
    width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--muted);
    flex-shrink: 0; cursor: pointer; display: grid; place-items: center;
    transition: all .2s; font-size: 16px; color: transparent;
  }
  .check:active { transform: scale(0.85); }
  .body { flex: 1; min-width: 0; }
  .body .label { font-size: 16px; word-break: break-word; }
  .pbar { height: 6px; background: var(--done); border-radius: 6px; margin-top: 8px; overflow: hidden; }
  .pbar > i { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .4s cubic-bezier(.2,.8,.2,1); }
  .count { font-size: 12px; color: var(--muted); margin-top: 5px; }

  /* アーカイブ */
  li.arch { background: var(--done); padding: 12px 16px; }
  li.arch .check { background: var(--accent); border-color: var(--accent); color: #fff; cursor: default; }
  li.arch .label { color: var(--muted); font-size: 15px; }
  li.arch .meta { font-size: 11px; color: var(--muted); margin-top: 3px; opacity: .8; }

  .del { color: var(--muted); background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px 8px; flex-shrink: 0; }

  .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 15px; line-height: 1.8; }

  /* 完了時の演出 */
  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(100px);
    background: #fff; color: #1b1d33; padding: 14px 24px; border-radius: 30px;
    font-weight: 700; font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.3);
    opacity: 0; transition: all .4s cubic-bezier(.2,.8,.2,1); z-index: 50; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast { width: max-content; max-width: min(90vw, 420px); text-align: center; z-index: 200; } /* 長い言葉も窮屈に折り返さない */

  /* ポッチを押した時のモーション */
  .check { position: relative; border-width: 1.5px; }
  .check svg { display: block; overflow: visible; }
  .check svg path { stroke-dasharray: 1; stroke-dashoffset: 1; }
  li.arch .check svg path { stroke-dashoffset: 0; }
  .check.popping svg path { animation: draw .32s .1s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .check:active { transform: scale(0.8); transition: transform .08s; }
  /* ポッチの色: Levelカードと同じ紺紫→ピンクのグラデを、少し透けさせたガラス調 */
  .check.popping, li.arch .check {
    background: linear-gradient(135deg, rgba(108,108,255,.82), rgba(255,108,171,.78));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 3px 10px rgba(108,108,255,.3), inset 0 1px 1px rgba(255,255,255,.55);
  }
  li.arch .check { box-shadow: 0 2px 6px rgba(108,108,255,.22), inset 0 1px 1px rgba(255,255,255,.45); }
  .check.popping svg, li.arch .check svg { filter: drop-shadow(0 1px 1.5px rgba(60,40,140,.4)); }
  .check.popping { animation: checkpop .6s cubic-bezier(.2,.9,.3,1.6); }
  @keyframes checkpop { 0% { transform: scale(.8); } 35% { transform: scale(1.5); } 65% { transform: scale(.92); } 100% { transform: scale(1); } }
  /* レベルアップの演出(控えめ) */
  .status .lvnum { transform-origin: left center; }
  .status .lvnum.lvup { animation: lvup .9s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes lvup {
    0% { transform: scale(1); }
    35% { transform: scale(1.4); text-shadow: 0 0 10px rgba(255,255,255,.3); }
    100% { transform: scale(1); }
  }
  .status.levelup { animation: levelglow 1.1s ease-out; }
  @keyframes levelglow {
    0% { box-shadow: 0 10px 30px rgba(108,108,255,.3); filter: brightness(1); }
    30% { box-shadow: 0 12px 34px rgba(108,108,255,.42); filter: brightness(1.06); }
    100% { box-shadow: 0 10px 30px rgba(108,108,255,.3); filter: brightness(1); }
  }
  /* バーが満タンになった瞬間の「充填」感 */
  .bar.full { animation: barflash .55s ease-out; }
  @keyframes barflash {
    0% { transform: scaleY(1.7); box-shadow: 0 0 12px rgba(255,255,255,.5); }
    100% { transform: scaleY(1); box-shadow: 0 0 0 rgba(255,255,255,0); }
  }
  .bar > i { position: relative; }
  .bar > i.charged::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 30%;
    background: linear-gradient(90deg, transparent, rgba(108,108,255,.38), transparent);
    animation: sweep .3s cubic-bezier(.4,0,.2,1);
  }
  @keyframes sweep { from { left: -40%; } to { left: 110%; } }
  .status.pulse { animation: statuspulse .7s cubic-bezier(.2,.8,.2,1); }
  @keyframes statuspulse {
    0% { transform: scale(1); }
    30% { transform: scale(1.03); box-shadow: 0 14px 40px rgba(108,108,255,.6); }
    100% { transform: scale(1); }
  }
  .check.popping::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 1.5px solid rgba(150,130,255,.7); animation: checkring .55s ease-out forwards; pointer-events: none; }
  @keyframes checkring { from { transform: scale(1); opacity: .9; } to { transform: scale(2.4); opacity: 0; } }
  li.doing { box-shadow: 0 0 0 1px rgba(130,120,255,.45), 0 6px 18px rgba(108,108,255,.2); transition: box-shadow .2s; }
  li.doing .label { color: var(--muted); text-decoration: line-through; transition: color .2s; }
  li.fresh { animation: fresh 1s cubic-bezier(.2,.8,.2,1); }
  @keyframes fresh {
    0% { opacity: 0; transform: translateY(-14px) scale(.97); box-shadow: 0 0 0 2px var(--accent); }
    35% { opacity: 1; transform: none; box-shadow: 0 0 0 2px var(--accent), 0 6px 20px rgba(108,108,255,.4); }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  /* 上部ボタン(同期・更新) */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 14px; }
  .topbar h1 { font-size: 20px; font-weight: 700; }
  .lead { font-size: 12px; color: var(--muted); margin: -6px 2px 16px; }

  /* クリア済みの見出し(押すと畳める) */
  .arch-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .arch-toggle .chev { transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  .arch-toggle.closed .chev { transform: rotate(-90deg); }
  .arch-count { background: var(--done); border-radius: 10px; padding: 1px 8px; font-size: 11px; letter-spacing: 0; }
  .headbtns { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .titlebox { min-width: 0; }
  .sync-btn { background: var(--card); color: var(--muted); border: none; border-radius: 20px; padding: 9px 15px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; flex-shrink: 0; min-width: 76px; }
  .sync-btn.on { background: var(--accent); color: #fff; }
  .reload-btn { display: grid; place-items: center; width: 40px; height: 40px; border: none; border-radius: 50%; background: var(--card); color: var(--muted); cursor: pointer; flex-shrink: 0; transition: transform .45s cubic-bezier(.2,.8,.2,1), color .2s; }
  .reload-btn:hover { color: var(--accent); }
  .reload-btn:active { transform: rotate(-180deg); color: var(--accent); }

  /* タイトル行と鉛筆 */
  .titlerow { display: flex; align-items: center; gap: 6px; }
  .edit-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 2px; display: grid; place-items: center; flex-shrink: 0; }
  .edit-btn:active { transform: scale(0.9); color: var(--accent); }

  /* 編集ダイアログ */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-start; justify-content: center; padding: 12vh 16px 20px; z-index: 100; overflow-y: auto; }
  .modal { background: var(--card); border-radius: 18px; padding: 18px; width: 100%; max-width: 400px; }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
  .modal-label { display: block; font-size: 12px; color: var(--muted); margin: 12px 2px 6px; }
  .modal-input { width: 100%; background: var(--bg); border: none; border-radius: 12px; padding: 14px; color: var(--text); font-size: 16px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
  .modal-actions button { flex: 1; border: none; border-radius: 12px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .modal-cancel { background: var(--done); color: var(--muted); }
  .modal-save { background: var(--accent); color: #fff; }

  /* バックアップ */
  .backup { display: flex; gap: 8px; }
  .backup-btn { flex: 1; text-align: center; background: var(--card); color: var(--text); border: none; border-radius: 12px; padding: 13px 14px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .backup-hint { font-size: 11px; color: var(--muted); margin: 8px 4px 0; }

  .confetti { position: fixed; top: -10px; width: 10px; height: 14px; z-index: 40; pointer-events: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>とりあえず</h1>
    <div class="headbtns">
    <button id="syncBtn" class="sync-btn" style="display:none">同期</button>
    <button id="reloadBtn" class="reload-btn" title="最新に更新" aria-label="最新に更新">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
        <path d="M21 3v6h-6"/>
      </svg>
    </button>
    </div>
  </div>
  <div class="lead">とりあえず1回。やるたびに成果がたまっていきます</div>

  <div class="status">
    <div class="lv">LEVEL</div>
    <div class="lvnum" id="lvnum">1</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="sub">
      <span id="xptext">0 / 100 pt</span>
      <span id="totaltext">今日 0 クリア</span>
    </div>
  </div>

  <div class="add">
    <input id="input" class="text" type="text" placeholder="やることを入力" maxlength="80" enterkeyhint="done">
    <input id="target" class="num" type="number" min="1" max="9999" placeholder="回数">
    <button id="addbtn">＋</button>
  </div>
  <div class="hint">回数は空欄なら1回。例「本を10p読む」で回数「50」</div>

  <div class="section-label">やること</div>
  <ul id="todo"></ul>
  <div class="section-label arch-toggle" id="archLabel" role="button" tabindex="0" aria-label="クリア済みを畳む/開く">
    <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    <span>クリア済み</span><span class="arch-count"></span>
  </div>
  <ul id="arch"></ul>

  <div class="section-label">バックアップ</div>
  <div class="backup">
    <button id="exportBtn" class="backup-btn">書き出し (保存)</button>
    <label class="backup-btn" for="importFile">読み込み (復元)</label>
    <input id="importFile" type="file" accept="application/json,.json" style="display:none">
  </div>
  <div class="backup-hint">記録をファイルに保存/復元できます。機種変更やバックアップに</div>
</div>

<div class="toast" id="toast">やったね +10pt</div>

<!-- Firebase (同期用。読み込めない時はローカルのみで動作) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
const PER_LEVEL = 100;   // 1レベルに必要なポイント
const PER_CLEAR = 10;    // 1クリアでもらえるポイント

// 古いバージョンや読み込んだデータが壊れていても動くよう整える
// tasks: { id, text, target, progress } / log: { id, taskId, text, repNo, target, time }
function normalize(s) {
  if (!s || typeof s !== "object") s = {};
  if (!Array.isArray(s.tasks)) s.tasks = [];
  if (!Array.isArray(s.log)) s.log = [];
  if (typeof s.xp !== "number") s.xp = 0;
  s.tasks.forEach(t => {
    if (typeof t.target !== "number" || t.target < 1) t.target = 1;
    if (typeof t.progress !== "number") t.progress = t.done ? 1 : 0;
  });
  return s;
}

let state = normalize(JSON.parse(localStorage.getItem("motiv") || "null"));
let applyingRemote = false;
let archOpen = localStorage.getItem("motiv_archOpen") !== "0"; // クリア済みを開いているか(端末ごとに覚える)

function save() {
  state.updatedAt = Date.now();
  localStorage.setItem("motiv", JSON.stringify(state));
  if (!applyingRemote) pushToCloud();
}

let toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1500);
}

function todayCount() {
  const t = new Date().toDateString();
  return state.log.filter(e => new Date(e.time).toDateString() === t).length;
}

function fmtTime(ms) {
  const d = new Date(ms);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hm = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  return sameDay ? "今日 " + hm : (d.getMonth()+1) + "/" + d.getDate() + " " + hm;
}

function render(skipStatus) {
  const todoEl = document.getElementById("todo");
  const archEl = document.getElementById("arch");
  todoEl.innerHTML = ""; archEl.innerHTML = "";

  // 進行中 = まだ回数が残っているタスク
  const active = state.tasks.filter(t => t.progress < t.target);
  if (active.length === 0) {
    todoEl.innerHTML = '<div class="empty">やることが空です✨<br>上の欄から追加しよう</div>';
  }
  active.forEach(t => todoEl.appendChild(makeActiveLi(t)));

  // アーカイブ = 1回ごとの記録を新しい順に
  const logs = state.log.slice().sort((a,b) => b.time - a.time);
  logs.forEach(e => archEl.appendChild(makeArchLi(e)));
  const show = logs.length > 0;
  const archLabel = document.getElementById("archLabel");
  archLabel.style.display = show ? "flex" : "none";
  archLabel.querySelector(".arch-count").textContent = logs.length;
  archLabel.classList.toggle("closed", !archOpen);
  archEl.style.display = (show && archOpen) ? "block" : "none";

  // ステータス(レベルアップ演出の間だけ後回しにできる)
  if (!skipStatus) renderStatus();
}

function renderStatus() {
  const lv = Math.floor(state.xp / PER_LEVEL) + 1;
  const inLv = state.xp % PER_LEVEL;
  document.getElementById("lvnum").textContent = lv;
  document.getElementById("bar").style.width = (inLv / PER_LEVEL * 100) + "%";
  document.getElementById("xptext").textContent = inLv + " / " + PER_LEVEL + " pt";
  document.getElementById("totaltext").textContent = "今日 " + todayCount() + " クリア";
}

function makeActiveLi(t) {
  const li = document.createElement("li");
  const check = document.createElement("div");
  check.className = "check";
  check.innerHTML = CHECK_SVG;
  check.onclick = () => {
    if (check.classList.contains("popping")) return; // 連打で二重に記録しない
    check.classList.add("popping");
    const li = check.closest("li");
    if (li) li.classList.add("doing");
    burstAt(check);
    floatText(check, "+" + PER_CLEAR);
    // レベルアップになる時は、紙吹雪の途中からバーを満タンまで伸ばし始める
    if (Math.floor((state.xp + PER_CLEAR) / PER_LEVEL) > Math.floor(state.xp / PER_LEVEL)) {
      levelUpFlashAt = performance.now() + BAR_START + BAR_FLASH;
      setTimeout(fillBarFull, BAR_START);
      setTimeout(flashBar, BAR_START + BAR_FLASH);
    }
    celebrate(t.progress + 1 >= t.target);
    setTimeout(() => doRep(t.id, true), 600); // モーションを見せてから移動
  };

  const body = document.createElement("div");
  body.className = "body";
  const titleRow = document.createElement("div");
  titleRow.className = "titlerow";
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = t.text;
  const edit = document.createElement("button");
  edit.className = "edit-btn"; edit.title = "編集"; edit.setAttribute("aria-label", "編集");
  edit.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  edit.onclick = () => editTask(t.id);
  titleRow.append(label, edit);
  body.appendChild(titleRow);
  if (t.target > 1) {
    const pbar = document.createElement("div");
    pbar.className = "pbar";
    const i = document.createElement("i");
    i.style.width = (t.progress / t.target * 100) + "%";
    pbar.appendChild(i);
    body.appendChild(pbar);
    const count = document.createElement("div");
    count.className = "count";
    count.textContent = t.progress + " / " + t.target + " 回  (あと " + (t.target - t.progress) + ")";
    body.appendChild(count);
  }

  const del = document.createElement("button");
  del.className = "del";
  del.textContent = "✕";
  del.onclick = () => removeTask(t.id);

  li.append(check, body, del);
  return li;
}

function makeArchLi(e) {
  const li = document.createElement("li");
  li.className = "arch" + (e.id === freshLogId ? " fresh" : "");
  const check = document.createElement("div");
  check.className = "check";
  check.innerHTML = CHECK_SVG;

  const body = document.createElement("div");
  body.className = "body";
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = e.text;
  body.appendChild(label);
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = (e.target > 1 ? e.repNo + "/" + e.target + "回目 ・ " : "") + fmtTime(e.time);
  body.appendChild(meta);

  const del = document.createElement("button");
  del.className = "del";
  del.textContent = "↩";
  del.title = "1回ぶん取り消す";
  del.onclick = () => undoRep(e.id);

  li.append(check, body, del);
  return li;
}

function addTask() {
  const input = document.getElementById("input");
  const targetEl = document.getElementById("target");
  const text = input.value.trim();
  if (!text) return;
  let target = parseInt(targetEl.value, 10);
  if (!target || target < 1) target = 1;
  state.tasks.unshift({ id: Date.now(), text, target, progress: 0 });
  input.value = ""; targetEl.value = "";
  save(); render();
}

let freshLogId = null; // 直前に積んだ記録(光らせる用)

// チェックマーク(線が描かれるアニメ用のSVG)
const CHECK_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" pathLength="1"/></svg>';
const BURST_COLORS = ["#8f8fff", "#ff8cc0", "#b9a0ff", "#ffb0d6"];

// ポッチを中心に光の粒が放射状に飛ぶ
function burstAt(el, count, spread) {
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const n = count || 14;
  for (let i = 0; i < n; i++) {
    const p = document.createElement("div");
    const size = 5 + Math.random() * 4;
    p.style.cssText = "position:fixed;left:" + (cx - size / 2) + "px;top:" + (cy - size / 2) + "px;width:" + size + "px;height:" + size + "px;border-radius:50%;pointer-events:none;z-index:60;background:" + BURST_COLORS[i % BURST_COLORS.length];
    document.body.appendChild(p);
    const ang = (Math.PI * 2 * i) / n + Math.random() * 0.4;
    const dist = (36 + Math.random() * 34) * (spread || 1);
    p.animate([
      { transform: "translate(0,0) scale(1)", opacity: 1 },
      { transform: "translate(" + Math.cos(ang) * dist + "px," + Math.sin(ang) * dist + "px) scale(.2)", opacity: 0 }
    ], { duration: 520 + Math.random() * 220, easing: "cubic-bezier(.15,.7,.3,1)", fill: "forwards" }).onfinish = () => p.remove();
  }
}

// 「+10」がふわっと浮かぶ
function floatText(el, text) {
  const r = el.getBoundingClientRect();
  const f = document.createElement("div");
  f.textContent = text;
  f.style.cssText = "position:fixed;left:" + (r.left + r.width / 2) + "px;top:" + (r.top - 2) + "px;font-weight:800;font-size:17px;color:#b9b9ff;pointer-events:none;z-index:60;text-shadow:0 2px 8px rgba(0,0,0,.45)";
  document.body.appendChild(f);
  f.animate([
    { transform: "translate(-50%, 0) scale(.7)", opacity: 0 },
    { transform: "translate(-50%, -14px) scale(1.15)", opacity: 1, offset: 0.25 },
    { transform: "translate(-50%, -52px) scale(1)", opacity: 0 }
  ], { duration: 900, easing: "cubic-bezier(.2,.8,.3,1)", fill: "forwards" }).onfinish = () => f.remove();
}

function doRep(id, silent) {
  const t = state.tasks.find(x => x.id === id);
  if (!t || t.progress >= t.target) { render(); return; }
  const lvBefore = Math.floor(state.xp / PER_LEVEL);
  t.progress += 1;
  state.xp += PER_CLEAR;
  const levelUp = Math.floor(state.xp / PER_LEVEL) > lvBefore;
  const entry = {
    id: Date.now() + Math.random(),
    taskId: t.id, text: t.text, repNo: t.progress, target: t.target, time: Date.now()
  };
  state.log.push(entry);
  if (!silent) celebrate(t.progress >= t.target);
  freshLogId = entry.id;
  save(); render(levelUp);
  freshLogId = null;
  if (levelUp) { playLevelUp(); return; }
  // 上のレベルのカードを脈打たせる
  const st = document.querySelector(".status");
  if (st) { st.classList.remove("pulse"); void st.offsetWidth; st.classList.add("pulse"); }
}

// レベルアップ演出のタイミング(ms): 押してからバーが伸び始めるまで / 伸びきるまで
// 伸び始め / 伸びる時間(一定の速さ) / 光る時刻(満タンになる瞬間) / 光の長さ / 光りきったあとに止まる時間
const BAR_START = 0, BAR_FILL = 600, BAR_FLASH = 600, FLASH_DUR = 550, HOLD = 100;
let levelUpFlashAt = 0; // 光る予定の時刻

// バーを光らせる(満タンになった瞬間)
function flashBar() {
  const bar = document.getElementById("bar");
  const track = bar.parentElement;
  bar.classList.remove("charged"); void bar.offsetWidth; bar.classList.add("charged");
  track.classList.remove("full"); void track.offsetWidth; track.classList.add("full");
}

// バーを満タンまで伸ばす
function fillBarFull() {
  const bar = document.getElementById("bar");
  // 一定の速さで伸ばす
  bar.style.transition = "width " + BAR_FILL + "ms linear";
  bar.style.width = "100%";
  document.getElementById("xptext").textContent = PER_LEVEL + " / " + PER_LEVEL + " pt";
}

// レベルアップ: 満タンになった瞬間に光が走り、新しいレベルに切り替える
function playLevelUp() {
  const bar = document.getElementById("bar");
  const num = document.getElementById("lvnum");
  const st = document.querySelector(".status");
  const lbl = document.querySelector(".status .lv");
  const track = bar.parentElement;
  fillBarFull(); // 念のため(すでに始まっていれば何も変わらない)
  // 光りきったあと、少し(HOLD)止まってから新しいレベルへ切り替える
  const wait = Math.max(0, levelUpFlashAt + FLASH_DUR + HOLD - performance.now());
  setTimeout(() => {
    // 満タンから空へ巻き戻る動きは見せず、一瞬で切り替える
    bar.classList.remove("charged"); track.classList.remove("full");
    bar.style.transition = "none";
    renderStatus();
    void bar.offsetWidth;
    bar.style.transition = "";
    num.classList.remove("lvup"); void num.offsetWidth; num.classList.add("lvup");
    st.classList.remove("levelup"); void st.offsetWidth; st.classList.add("levelup");
    burstAt(num, 24, 1.8);
    if (navigator.vibrate) navigator.vibrate([20, 40, 20, 40, 60]);
    lbl.textContent = "LEVEL UP!";
    setTimeout(() => { lbl.textContent = "LEVEL"; }, 2000);
  }, wait);
}

function undoRep(logId) {
  const idx = state.log.findIndex(e => e.id === logId);
  if (idx === -1) return;
  const e = state.log[idx];
  state.log.splice(idx, 1);
  state.xp = Math.max(0, state.xp - PER_CLEAR);
  const t = state.tasks.find(x => x.id === e.taskId);
  if (t) t.progress = Math.max(0, t.progress - 1);
  save(); render();
}

// 鉛筆から: タイトルと回数を編集するダイアログ
function editTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  const ov = document.createElement("div");
  ov.className = "modal-overlay";
  const box = document.createElement("div");
  box.className = "modal";
  box.innerHTML =
    '<div class="modal-title">やることを編集</div>' +
    '<label class="modal-label">タイトル</label>' +
    '<input class="modal-input" id="editText" type="text" maxlength="80">' +
    '<label class="modal-label">回数 (いま ' + t.progress + ' 回済み)</label>' +
    '<input class="modal-input" id="editTarget" type="number" min="1" max="9999">' +
    '<div class="modal-actions">' +
      '<button class="modal-cancel" id="editCancel">キャンセル</button>' +
      '<button class="modal-save" id="editSave">保存</button>' +
    '</div>';
  ov.appendChild(box);
  document.body.appendChild(ov);
  const textEl = box.querySelector("#editText");
  const targetEl = box.querySelector("#editTarget");
  textEl.value = t.text;
  targetEl.value = t.target;

  const close = () => ov.remove();
  box.querySelector("#editCancel").onclick = close;
  ov.onclick = (e) => { if (e.target === ov) close(); };
  box.querySelector("#editSave").onclick = () => {
    const text = textEl.value.trim();
    const target = parseInt(targetEl.value, 10);
    if (!text) { showToast("タイトルが空です"); return; }
    if (!target || target < 1) { showToast("回数は1以上にしてください"); return; }
    if (target < t.progress) { showToast("済んだ回数(" + t.progress + ")以上にしてください"); return; }
    t.text = text;
    t.target = target;
    // クリア済みの記録の表示も合わせる
    state.log.forEach(e => { if (e.taskId === t.id) { e.text = text; e.target = target; } });
    save(); render();
    close();
    showToast("変更しました");
  };
}

function removeTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  if (!confirm("「" + t.text + "」を削除しますか？\nクリア済みの記録は残ります")) return;
  state.tasks = state.tasks.filter(x => x.id !== id);
  // クリア済みの記録(ログ)は消さずに残す
  save(); render();
}

function celebrate(completed) {
  const toast = document.getElementById("toast");
  toast.textContent = completed ? "コンプリート🎉 +" + PER_CLEAR + "pt" : "やったね +" + PER_CLEAR + "pt";
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1400);
  if (navigator.vibrate) navigator.vibrate(completed ? [30,40,60] : 30);
  const colors = ["#6c6cff", "#ff6cab", "#ffd36c", "#6cffb0"];
  const n = completed ? 60 : 14;
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.transform = "rotate(" + Math.random() * 360 + "deg)";
    document.body.appendChild(c);
    const fall = 100 + Math.random() * 20;
    const drift = (Math.random() - 0.5) * 200;
    c.animate([
      { transform: c.style.transform + " translateY(0)", opacity: 1 },
      { transform: "translate(" + drift + "px," + fall + "vh) rotate(720deg)", opacity: 0 }
    ], { duration: 1400 + Math.random() * 600, easing: "cubic-bezier(.2,.6,.4,1)", fill: "forwards" }).onfinish = () => c.remove();
  }
}

document.getElementById("addbtn").onclick = addTask;
// Enterでは追加しない(＋ボタンのみ)。欄の移動はTab
document.getElementById("input").addEventListener("keydown", e => { if (e.key === "Enter") e.preventDefault(); });
document.getElementById("target").addEventListener("keydown", e => { if (e.key === "Enter") e.preventDefault(); });
document.getElementById("reloadBtn").onclick = () => location.reload();

// クリア済みを畳む/開く
function toggleArch() {
  archOpen = !archOpen;
  localStorage.setItem("motiv_archOpen", archOpen ? "1" : "0");
  document.getElementById("archLabel").classList.toggle("closed", !archOpen);
  document.getElementById("arch").style.display = archOpen ? "block" : "none";
}
document.getElementById("archLabel").onclick = toggleArch;
document.getElementById("archLabel").addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleArch(); }
});

// ===== バックアップ(書き出し/読み込み) =====
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  const a = document.createElement("a");
  a.href = url;
  a.download = "yaruki-backup-" + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast("書き出しました");
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let obj;
    try { obj = JSON.parse(reader.result); }
    catch (e) { showToast("読み込めませんでした (ファイル形式)"); return; }
    if (!obj || !Array.isArray(obj.tasks)) { showToast("バックアップではないようです"); return; }
    if (!confirm("今の記録を、読み込んだ内容で置き換えます。よろしいですか？")) return;
    state = normalize(obj);
    save(); render();
    showToast("読み込みました ✅");
  };
  reader.readAsText(file);
}

document.getElementById("exportBtn").onclick = exportData;
document.getElementById("importFile").onchange = (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) importData(f);
  e.target.value = "";
};

render();

/* ===== クラウド同期 (Firebase + Googleログイン) ===== */
// そろそろと同じFirebaseプロジェクトを使い、保存先だけ別(apps/motivation)
const firebaseConfig = {
  apiKey: "AIzaSyC6KM0ZiG4boea6h8KL7lGEnREC2Itm9oY",
  authDomain: "cycle-tracker-app-77383.firebaseapp.com",
  projectId: "cycle-tracker-app-77383",
  storageBucket: "cycle-tracker-app-77383.firebasestorage.app",
  messagingSenderId: "217290900134",
  appId: "1:217290900134:web:2c6d1a37ca964e2749ea67"
};

let fbUser = null, fbDb = null, fbUnsub = null;

(function initSync() {
  if (typeof firebase === "undefined") return; // SDK未読込(オフライン等)→ローカルのみ
  try {
    firebase.initializeApp(firebaseConfig);
    fbDb = firebase.firestore();
    firebase.auth().getRedirectResult().catch(() => {});
    firebase.auth().onAuthStateChanged(onAuthChanged);
  } catch (e) { console.warn("sync init failed", e); }
  const btn = document.getElementById("syncBtn");
  btn.style.display = "inline-block";
  btn.onclick = onSyncClick;
  renderSyncUI();
})();

function dataDoc() {
  return fbDb.collection("users").doc(fbUser.uid).collection("apps").doc("motivation");
}

function onAuthChanged(user) {
  fbUser = user;
  renderSyncUI();
  if (fbUnsub) { fbUnsub(); fbUnsub = null; }
  if (user) startSync();
}

function startSync() {
  dataDoc().get().then(snap => {
    const remote = snap.exists ? snap.data() : null;
    const localAt = state.updatedAt || 0;
    const remoteAt = remote ? (remote.updatedAt || 0) : -1;
    if (remote && remoteAt >= localAt) applyRemote(remote);
    else pushToCloud(); // ローカルが新しい/クラウドが空 → 上げる
    fbUnsub = dataDoc().onSnapshot(s => {
      if (!s.exists) return;
      const r = s.data();
      if ((r.updatedAt || 0) > (state.updatedAt || 0)) applyRemote(r);
    });
  }).catch(e => { console.warn(e); showToast("同期の読み込みに失敗"); });
}

function applyRemote(r) {
  applyingRemote = true;
  const at = r.updatedAt || Date.now();
  state = normalize(r);
  state.updatedAt = at;
  localStorage.setItem("motiv", JSON.stringify(state));
  render();
  applyingRemote = false;
  showToast("同期で最新になりました");
}

function pushToCloud() {
  if (!fbUser || !fbDb) return;
  try { dataDoc().set(JSON.parse(JSON.stringify(state))); }
  catch (e) { console.warn("push failed", e); }
}

function renderSyncUI() {
  const btn = document.getElementById("syncBtn");
  if (!btn) return;
  if (fbUser) { btn.textContent = "同期中"; btn.classList.add("on"); btn.title = (fbUser.email || "") + " / タップでログアウト"; }
  else { btn.textContent = "同期"; btn.classList.remove("on"); btn.title = "Googleでログインして同期"; }
}

function onSyncClick() {
  if (typeof firebase === "undefined") { showToast("同期にはネット接続が必要です"); return; }
  if (fbUser) {
    if (confirm("同期をオフにしますか？（ログアウト）\n記録はこの端末に残ります")) firebase.auth().signOut();
    return;
  }
  const provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider).catch(err => {
    const code = err && err.code;
    if (code === "auth/popup-blocked" || code === "auth/cancelled-popup-request" || code === "auth/operation-not-supported-in-this-environment" || code === "auth/popup-closed-by-user") {
      firebase.auth().signInWithRedirect(provider);
    } else {
      console.warn(err);
      showToast("ログインできませんでした");
    }
  });
}
